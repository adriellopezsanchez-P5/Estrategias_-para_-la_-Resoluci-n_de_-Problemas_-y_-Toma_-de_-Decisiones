<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1.2 Estructura de un problema · Portada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ==================== RESET Y ESTILOS BASE ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Comic Sans MS', sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ==================== FONDO AZUL CON PUNTOS ==================== */
        .page-content {
            background: repeating-conic-gradient(#b3d9ff 0% 25%, #4da6ff 0% 50%) 0 0 / 40px 40px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.3) 3px, transparent 3px),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.25) 4px, transparent 4px),
                linear-gradient(135deg, #b3d9ff 0%, #80bfff 50%, #4da6ff 100%);
            background-blend-mode: overlay, normal, normal;
            background-size: 60px 60px, 80px 80px, cover;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* ===== CUADRO CENTRAL (ESTILO CÓMIC) ===== */
        .portada-card {
            max-width: 900px;
            width: 100%;
            background: #fff;
            border: 6px solid #000;
            border-radius: 40px 40px 20px 20px;
            box-shadow: 12px 12px 0 #000;
            padding: 3rem 3.5rem;
            text-align: center;
            transition: all 0.1s ease;
            position: relative;
        }

        /* Pequeño detalle de esquina de cómic */
        .portada-card::before {
            content: "⚡";
            position: absolute;
            top: -18px;
            right: 30px;
            font-size: 2.5rem;
            background: #ffe600;
            border: 4px solid #000;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 0 #000;
            transform: rotate(15deg);
        }

        .portada-titulo {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            line-height: 1.1;
            letter-spacing: 3px;
            color: #000;
            text-shadow: 4px 4px 0 rgba(255, 0, 0, 0.2);
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .portada-subtitulo {
            font-family: 'Bangers', cursive;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #000;
            background: #ffe600;
            display: inline-block;
            padding: 0.2rem 2rem;
            border-radius: 60px;
            border: 4px solid #000;
            box-shadow: 5px 5px 0 #000;
            margin-bottom: 2rem;
            transform: rotate(-1deg);
        }

        /* ===== ESTRUCTURA JERÁRQUICA ===== */
        .portada-estructura {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin: 1rem 0;
        }

        .estructura-item {
            font-family: 'Bangers', cursive;
            font-size: 1.8rem;
            letter-spacing: 1.5px;
            color: #000;
            background: #fff;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            border: 4px solid #000;
            box-shadow: 4px 4px 0 #000;
            display: inline-block;
            margin: 0 auto;
            width: auto;
            min-width: 280px;
            transition: all 0.1s ease;
        }

        .estructura-item.principal {
            background: #ffe600;
            font-size: 2.2rem;
            padding: 0.6rem 2rem;
            box-shadow: 5px 5px 0 #000;
            margin-bottom: 0.5rem;
        }

        .estructura-item.sub1 {
            background: #ff4d4d;
            color: #fff;
            transform: rotate(-1deg);
        }

        .estructura-item.sub2 {
            background: #4da6ff;
            color: #fff;
            transform: rotate(1deg);
        }

        .estructura-item.sub3 {
            background: #00cc88;
            color: #fff;
            transform: rotate(-0.5deg);
        }

        .estructura-item:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }

        /* ==================== BOTÓN FLOTANTE ==================== */
        .btn-flotante {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #ffe600;
            border: 4px solid #000;
            border-radius: 60px;
            padding: 0.8rem 1.8rem;
            font-family: 'Bangers', cursive;
            font-size: 1.6rem;
            letter-spacing: 2px;
            color: #000;
            text-transform: uppercase;
            box-shadow: 6px 6px 0 #000;
            cursor: pointer;
            transition: all 0.05s ease;
            z-index: 999;
            text-decoration: none;
            display: inline-block;
            transform: rotate(1deg);
        }
        .btn-flotante:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #000;
        }
        @media (max-width: 600px) {
            .btn-flotante {
                bottom: 1rem;
                right: 1rem;
                padding: 0.6rem 1.2rem;
                font-size: 1.2rem;
            }
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 700px) {
            .portada-card {
                padding: 2rem 1.5rem;
            }
            .portada-titulo {
                font-size: 2.8rem;
            }
            .portada-subtitulo {
                font-size: 1.6rem;
                padding: 0.2rem 1.2rem;
            }
            .estructura-item {
                font-size: 1.4rem;
                min-width: 200px;
                padding: 0.4rem 1.2rem;
            }
            .estructura-item.principal {
                font-size: 1.8rem;
                padding: 0.5rem 1.5rem;
            }
            .portada-card::before {
                font-size: 1.8rem;
                width: 40px;
                height: 40px;
                top: -14px;
                right: 20px;
            }
        }

        @media (max-width: 480px) {
            .portada-titulo {
                font-size: 2.2rem;
            }
            .portada-subtitulo {
                font-size: 1.3rem;
            }
            .estructura-item {
                font-size: 1.2rem;
                min-width: 160px;
                padding: 0.3rem 1rem;
            }
            .estructura-item.principal {
                font-size: 1.5rem;
                padding: 0.4rem 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
    <div class="page-content">

        <!-- ===== CUADRO CENTRAL ===== -->
        <div class="portada-card">
            <h1 class="portada-titulo">1.2 Estructura de un problema</h1>

            <div class="portada-subtitulo">¡Desglosa el desafío!</div>

            <div class="portada-estructura">
                <div class="estructura-item principal">1.2 Estructura de un problema</div>
                <div class="estructura-item sub1">1.2.1 Causas</div>
                <div class="estructura-item sub2">1.2.2 Consecuencias</div>
                <div class="estructura-item sub3">1.2.3 Actores involucrados</div>
            </div>
        </div>

    </div>

    <!-- ==================== BOTÓN FLOTANTE "Comienza" ==================== -->
    <a href="%282%29%201.2%20estructura%20de%20un%20problema.html" class="btn-flotante">Comienza</a>

</body>
</html>
