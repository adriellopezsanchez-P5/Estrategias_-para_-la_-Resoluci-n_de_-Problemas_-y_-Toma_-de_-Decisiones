<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Módulo I · Carátula</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== SECCIÓN CARÁTULA CON FONDO DE BLOQUES DE COLOR ===== */
        .cover-section {
            min-height: 100vh; /* Ocupa toda la altura de la ventana */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
            /* Fondo fragmentado: bloques de colores con puntos Ben-Day */
            background:
                /* Patrón de puntos sobre todo (se superpone a los bloques) */
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.25) 3px, transparent 3px),
                radial-gradient(circle at 70% 60%, rgba(255,255,255,0.2) 4px, transparent 4px),
                radial-gradient(circle at 40% 80%, rgba(0,0,0,0.1) 2px, transparent 2px),
                /* Bloques de colores (cada uno ocupa una franja) */
                linear-gradient(135deg, #ff4d4d 0% 25%, #ffe600 25% 50%, #4d9eff 50% 75%, #ff6eb4 75% 100%);
            background-blend-mode: overlay, overlay, overlay, normal;
            background-size: 60px 60px, 80px 80px, 50px 50px, 100% 100%;
            background-position: 0 0, 0 0, 0 0, 0 0;
            background-repeat: repeat, repeat, repeat, no-repeat;
        }

        /* Opción alternativa: bloques diagonales más grandes */
        .cover-section.diagonal {
            background:
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.2) 3px, transparent 3px),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.1) 4px, transparent 4px),
                linear-gradient(45deg, #ff4d4d 0% 30%, #ffe600 30% 60%, #4d9eff 60% 85%, #ff6eb4 85% 100%);
            background-blend-mode: overlay, overlay, normal;
            background-size: 40px 40px, 60px 60px, 100% 100%;
            background-repeat: repeat, repeat, no-repeat;
        }

        /* ===== CUADRO CENTRAL (ESTILO CÓMIC) ===== */
        .modulo-card {
            background: #ffe600;
            border: 6px solid #000;
            border-radius: 40px 40px 20px 20px;
            box-shadow: 12px 12px 0 #000;
            padding: 2.5rem 3rem;
            max-width: 800px;
            width: 100%;
            text-align: center;
            transition: all 0.1s ease;
            position: relative;
            z-index: 2; /* Para que quede por encima del fondo */
        }

        .modulo-titulo {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            line-height: 1.1;
            letter-spacing: 2px;
            color: #000;
            text-shadow: 4px 4px 0 rgba(255, 0, 0, 0.25);
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        .modulo-proposito {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a1a1a;
            background: #fff;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            border: 4px solid #000;
            box-shadow: 5px 5px 0 #000;
            display: inline-block;
            line-height: 1.5;
            max-width: 90%;
            margin: 0 auto;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .modulo-card {
                padding: 1.8rem 1.5rem;
            }
            .modulo-titulo {
                font-size: 2.5rem;
            }
            .modulo-proposito {
                font-size: 1rem;
                padding: 0.4rem 1rem;
            }
            .cover-section {
                min-height: 100vh;
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .modulo-titulo {
                font-size: 2rem;
            }
            .modulo-proposito {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== SECCIÓN CARÁTULA CON FONDO FRAGMENTADO ===== -->
    <section class="cover-section">
        <div class="modulo-card">
            <h1 class="modulo-titulo">MÓDULO I<br />Análisis y estructura de los problemas.</h1>
            <div class="modulo-proposito">
                Propósito: Analizar la estructura y tipos de problemas mediante la identificación de sus elementos, causas y consecuencias como base para la toma de decisiones fundamentadas.
            </div>
        </div>
    </section>
</body>
    <!-- Botón flotante de Comenzar (estilo cómic) -->
<a href="index.html" class="btn-comenzar-flotante" 
   style="position: fixed; 
          right: 20px; 
          top: 50%; 
          transform: translateY(-50%); 
          z-index: 9999; 
          font-family: 'Bangers', cursive; 
          font-size: 2rem; 
          color: #000; 
          background: #ffe600; 
          padding: 15px 30px; 
          border: 4px solid #000; 
          border-radius: 40px; 
          box-shadow: 6px 6px 0 #000; 
          text-transform: uppercase; 
          text-decoration: none; 
          transition: all 0.2s ease;">
    COMENZAR
</a>

<style>
    .btn-comenzar-flotante:hover {
        background: #fff;
        transform: translateY(-50%) scale(1.05);
        box-shadow: 8px 8px 0 #000;
    }
</style>
</html>
